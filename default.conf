server {
    listen       80;
    server_name  localhost;

    # Serve your Catcharr UI and PWA assets
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Ensures the Service Worker and Manifest are always fresh
    location ~* \.(?:manifest|sw\.js|json)$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    }

    # Intercept standard API calls (Guide & Recording)
    location /api/ {
        proxy_pass http://192.168.1.1:9191/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- AUTHENTICATION FIX FOR VIDEO & DOWNLOADS ---
        set $auth_key $http_x_api_key;
        if ($arg_api_key) {
            set $auth_key $arg_api_key;
        }
        proxy_set_header X-API-Key $auth_key;

        # --- MASSIVE FILE TRANSFER FIXES ---
        # Disable buffering so Nginx passes data straight to the browser
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Extend timeouts from the default 60 seconds to 24 hours
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        send_timeout 86400s;
        
        # Remove any size limitations
        client_max_body_size 0;
    }
}
