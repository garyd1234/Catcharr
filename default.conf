server {
    listen       80;
    server_name  localhost;

    # Serve your Catcharr UI and PWA assets
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Ensures the Service Worker and Manifest are always fresh
        location ~* \.(?:manifest|service-worker\.js)$ {
            expires -1;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        }
    }

    # Intercept standard API calls (Guide & Recording)
    location /api/ {
        proxy_pass http://192.168.1.1:9191/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
