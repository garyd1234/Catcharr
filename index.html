<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catcharr</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1f2937">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Catcharr">
    <link rel="apple-touch-icon" href="/icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #record-modal { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-open { transform: translateY(0%); }
        .modal-closed { transform: translateY(100%); }
        #video-modal { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-blue-500/30">

    <header class="sticky top-0 z-40 bg-gray-800/95 backdrop-blur-sm shadow-xl border-b border-gray-700">
        <div class="px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-blue-400 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-blue-400">
                    <path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3.1-9-7.56c0-1.25.5-2.4 1.1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/>
                    <path d="M8 14v.5"/><path d="M16 14v.5"/><path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/>
                </svg>
                Catcharr
            </h1>
            <div id="status-indicator" class="flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </div>
        </div>
        
        <div class="px-4 pb-3 flex gap-2">
            <select id="group-filter" class="bg-gray-700 text-white rounded-lg px-2 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 max-w-[120px] truncate text-sm border-none">
                <option value="ALL">All Groups</option>
            </select>
            <input type="text" id="search-input" placeholder="Search shows or channels..." 
                class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm border-none">
        </div>
    </header>

    <main class="pb-24">
        <div id="epg-container" class="divide-y divide-gray-800/50">
            <div class="p-12 text-center text-gray-500" id="loading-state">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mb-4"></div>
                <p class="text-sm font-medium">Fetching the Grid...</p>
            </div>
        </div>
    </main>

    <div id="record-modal" class="fixed inset-x-0 bottom-0 z-50 bg-gray-800 rounded-t-3xl shadow-2xl modal-closed p-6 border-t border-gray-700 pb-10">
        <div class="w-12 h-1.5 bg-gray-600 rounded-full mx-auto mb-6"></div>
        <div class="mb-6">
            <h2 id="modal-title" class="text-2xl font-bold text-white mb-1 leading-tight">Show Title</h2>
            <p id="modal-channel" class="text-blue-400 font-medium text-sm mb-3">Channel Name</p>
            <p id="modal-desc" class="text-gray-400 text-sm leading-relaxed overflow-y-auto max-h-32 no-scrollbar">Description...</p>
        </div>
        <div class="flex gap-3">
            <button onclick="closeModal()" class="w-16 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-2xl transition-colors active:scale-95 flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <button id="btn-play" onclick="playStream()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6V4z"/></svg>
                Watch
            </button>
            <button id="btn-record" onclick="submitRecording()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/></svg>
                Record
            </button>
        </div>
    </div>

    <div id="video-modal" class="fixed inset-0 bg-black z-50 hidden flex-col opacity-0">
        <div class="p-4 flex justify-between items-center bg-gradient-to-b from-black/90 to-transparent absolute top-0 w-full z-10 pt-10">
            <h2 id="video-title" class="text-white font-bold truncate pr-4 text-lg">Channel Name</h2>
            <button onclick="closeVideo()" class="bg-gray-800/80 rounded-full p-2 text-white hover:bg-red-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="flex-1 flex items-center justify-center bg-black relative">
            <video id="tv-player" class="w-full h-full max-h-screen object-contain" controls playsinline></video>
            <div id="video-error" class="hidden absolute inset-0 flex-col items-center justify-center bg-black/90 text-center p-6 z-20">
                <svg class="w-12 h-12 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <p id="video-error-title" class="font-bold text-lg text-white mb-2">Playback Error</p>
                <p id="video-error-text" class="text-sm text-gray-400">Could not connect to the stream.</p>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="closeModal()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden transition-opacity duration-300"></div>

    <script>
        // --- CONFIGURATION ---
        const DISPATCHARR_URL = ''; 
        const DIRECT_BACKEND_URL = 'http://192.168.1.1:9191'; 
        
        const API_KEY = 'YOUR_PERMANENT_API_KEY_HERE'; 
        const STREAM_USERNAME = 'YOUR_DISPATCHARR_USERNAME'; 
        const STREAM_PASSWORD = 'YOUR_DISPATCHARR_XC_PASSWORD'; 

        let currentEpgData = [];
        let channelLookupTable = [];
        let selectedProgram = null;
        let mpegtsPlayer = null; 

        // Initialize PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.error('Service Worker registration failed: ', err);
                });
            });
        }

        async function fetchEPG() {
            try {
                const [gridRes, lookupRes] = await Promise.all([
                    fetch(`${DISPATCHARR_URL}/api/epg/grid/`, { headers: { 'X-API-Key': API_KEY } }),
                    fetch(`${DISPATCHARR_URL}/api/channels/channels/?page_size=10000`, { headers: { 'X-API-Key': API_KEY } }).catch(() => null)
                ]);

                if (!gridRes.ok) throw new Error(`Server returned ${gridRes.status}`);
                
                if (lookupRes && lookupRes.ok) {
                    const lData = await lookupRes.json();
                    channelLookupTable = lData.results || lData.data || lData || [];
                }
                
                const rawData = await gridRes.json();
                const dataArray = rawData.results || rawData.data || rawData.channels || (Array.isArray(rawData) ? rawData : []);

                if (!Array.isArray(dataArray)) throw new Error("Invalid data format received.");

                let channelsMap = new Map();

                dataArray.forEach(item => {
                    let rawId, rawName, rawGroup;
                    let programsToPush = [];

                    if (Array.isArray(item.programs)) {
                        rawId = item.id || item.channel_id;
                        rawName = item.name || item.title || `Channel ${rawId}`;
                        rawGroup = item.channel_group || item.group;
                        programsToPush = item.programs;
                    } else {
                        if (item.channel && typeof item.channel === 'object') {
                            rawId = item.channel.id;
                            rawName = item.channel.name;
                            rawGroup = item.channel.channel_group;
                        } else {
                            rawId = item.channel_id || item.channel || item.tvg_id;
                            rawName = item.channel_name || item.tvg_name || `Channel ${rawId}`;
                        }
                        programsToPush = [item];
                    }

                    if (!rawId) return; 

                    let trueId = rawId;
                    let trueName = rawName;
                    let trueGroup = rawGroup;

                    const searchId = String(rawId).toLowerCase();
                    const searchName = String(rawName).toLowerCase();

                    const match = channelLookupTable.find(c => 
                        String(c.id) === searchId || 
                        (c.tvg_id && String(c.tvg_id).toLowerCase() === searchId) || 
                        (c.name && String(c.name).toLowerCase() === searchName)
                    );

                    if (match) {
                        trueId = parseInt(match.id, 10) || match.id;
                        trueName = match.name || trueName;
                        trueGroup = match.channel_group_name || match.channel_group || match.group || trueGroup;
                    }

                    if (!trueGroup || String(trueGroup).toLowerCase() === 'undefined' || String(trueGroup).toLowerCase() === 'null') {
                        trueGroup = 'LIVE TV';
                    }

                    let ch = channelsMap.get(String(trueId));
                    if (!ch) {
                        ch = { id: trueId, name: trueName, group: trueGroup, programs: [] };
                        channelsMap.set(String(trueId), ch);
                    }
                    ch.programs.push(...programsToPush);
                });

                currentEpgData = Array.from(channelsMap.values()).map(ch => {
                    const nowTime = new Date();
                    let active = ch.programs.find(p => p.start_time && p.end_time && new Date(p.start_time) <= nowTime && new Date(p.end_time) > nowTime);
                    
                    if (!active && ch.programs.length > 0) active = ch.programs[0];

                    return {
                        id: ch.id,
                        name: ch.name,
                        group: ch.group,
                        now: active || null
                    };
                });

                currentEpgData.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                populateGroupDropdown(currentEpgData);
                renderEPG(currentEpgData);
            } catch (error) {
                console.error("EPG Fetch Error:", error);
                document.getElementById('loading-state').innerHTML = `<div class="px-6"><p class="text-red-400 font-bold mb-1">Guide Load Failed</p><p class="text-xs text-gray-500">${error.message}</p></div>`;
            }
        }

        function populateGroupDropdown(channels) {
            const groupSelect = document.getElementById('group-filter');
            const uniqueGroups = [...new Set(channels.map(ch => ch.group))].filter(Boolean).sort();
            
            groupSelect.innerHTML = '<option value="ALL">All Groups</option>';
            uniqueGroups.forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.innerText = group;
                groupSelect.appendChild(option);
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const selectedGroup = document.getElementById('group-filter').value;

            const filtered = currentEpgData.filter(ch => {
                const matchesGroup = selectedGroup === 'ALL' || ch.group === selectedGroup;
                const matchesSearch = ch.name.toLowerCase().includes(searchTerm) || (ch.now && ch.now.title.toLowerCase().includes(searchTerm));
                return matchesGroup && matchesSearch;
            });
            renderEPG(filtered);
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('group-filter').addEventListener('change', applyFilters);

        function renderEPG(channels) {
            const container = document.getElementById('epg-container');
            container.innerHTML = ''; 
            
            if (channels.length === 0) {
                container.innerHTML = '<div class="p-12 text-center text-gray-500">No matching channels found.</div>';
                return;
            }

            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'p-4 active:bg-gray-800 transition-colors duration-100 cursor-pointer';
                card.setAttribute('onclick', `openModal('${ch.id}')`);
                
                const nowTitle = ch.now ? ch.now.title : 'No Information';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-base truncate pr-4 text-gray-100">${ch.name}</h3>
                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">${ch.group}</span>
                    </div>
                    <div class="bg-gray-800/40 border border-gray-700/50 p-3 rounded-xl flex justify-between items-center group">
                        <div class="flex-1 truncate mr-3">
                            <span class="text-[10px] font-bold text-blue-500 uppercase mb-0.5 block">Now Playing</span>
                            <p class="font-semibold text-white truncate text-sm">${nowTitle}</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-white group-active:bg-blue-600 transition-colors shadow-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(channelId) {
            const channel = currentEpgData.find(c => String(c.id) === String(channelId));
            if (!channel) return; 
            
            const activeProgram = channel.now || {};
            
            selectedProgram = {
                trueChannelId: channel.id, 
                channelName: channel.name,
                id: activeProgram.id,
                start_time: activeProgram.start_time,
                end_time: activeProgram.end_time,
                title: activeProgram.title,
                description: activeProgram.description || activeProgram.desc
            };
            
            let timeString = '';
            if (selectedProgram.start_time && selectedProgram.end_time) {
                const start = new Date(selectedProgram.start_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const end = new Date(selectedProgram.end_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                timeString = ` • ${start} - ${end}`;
            }

            document.getElementById('modal-title').innerText = selectedProgram.title || 'No Program Data';
            document.getElementById('modal-channel').innerText = `${channel.name}${timeString}`;
            document.getElementById('modal-desc').innerText = selectedProgram.description || 'No description available for this channel.';
            
            const btnRecord = document.getElementById('btn-record');
            const btnPlay = document.getElementById('btn-play');
            
            let rawChanId = selectedProgram.trueChannelId;
            if (typeof rawChanId === 'object' && rawChanId !== null) rawChanId = rawChanId.id || rawChanId.pk || rawChanId;
            
            let chanIdInt = parseInt(rawChanId, 10);
            if (isNaN(chanIdInt)) {
                const searchId = String(rawChanId).toLowerCase();
                const searchName = String(selectedProgram.channelName).toLowerCase();
                let match = channelLookupTable.find(c => (c.tvg_id && String(c.tvg_id).toLowerCase() === searchId) || (c.name && String(c.name).toLowerCase() === searchName) || String(c.id) === searchId);
                if (!match) match = channelLookupTable.find(c => JSON.stringify(c).toLowerCase().includes(searchId) || JSON.stringify(c).toLowerCase().includes(searchName));
                if (match && match.id) chanIdInt = parseInt(match.id, 10);
            }

            if (isNaN(chanIdInt)) {
                btnPlay.classList.replace('bg-blue-600', 'bg-gray-600');
                btnPlay.disabled = true;
            } else {
                selectedProgram.mappedIntId = chanIdInt; 
                btnPlay.classList.replace('bg-gray-600', 'bg-blue-600');
                btnPlay.disabled = false;
            }

            if (!selectedProgram.id || isNaN(chanIdInt)) {
                btnRecord.classList.replace('bg-red-600', 'bg-gray-600');
                btnRecord.disabled = true;
            } else {
                btnRecord.classList.replace('bg-gray-600', 'bg-red-600');
                btnRecord.disabled = false;
            }

            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('record-modal').classList.replace('modal-closed', 'modal-open');
        }

        function closeModal() {
            document.getElementById('record-modal').classList.replace('modal-open', 'modal-closed');
            setTimeout(() => document.getElementById('modal-overlay').classList.add('hidden'), 300);
        }

        function playStream() {
            closeModal(); 

            const videoModal = document.getElementById('video-modal');
            const videoElement = document.getElementById('tv-player');
            const errorOverlay = document.getElementById('video-error');
            
            document.getElementById('video-title').innerText = selectedProgram.channelName;
            
            videoModal.classList.remove('hidden');
            videoModal.classList.add('flex');
            setTimeout(() => videoModal.classList.replace('opacity-0', 'opacity-100'), 50); 
            
            // Hide the error overlay by default
            errorOverlay.classList.add('hidden');
            errorOverlay.classList.remove('flex');

            if (mpegtsPlayer) {
                mpegtsPlayer.destroy();
                mpegtsPlayer = null;
            }

            // Remove any previous error listeners from Safari
            videoElement.onerror = null;

            videoElement.addEventListener('playing', () => {
                errorOverlay.classList.add('hidden');
                errorOverlay.classList.remove('flex');
            });

            if (typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback) {
                // --- ANDROID / CHROME / PC PLAYER (MPEG-TS) ---
                const streamUrl = `${DIRECT_BACKEND_URL}/${STREAM_USERNAME}/${STREAM_PASSWORD}/${selectedProgram.mappedIntId}`;
                console.log("Loading DIRECT stream bypass:", streamUrl);

                mpegtsPlayer = mpegts.createPlayer({
                    type: 'm2ts', 
                    isLive: true,
                    url: streamUrl,
                    hasAudio: true,  
                    hasVideo: true   
                }, {
                    enableStashBuffer: true,
                    stashInitialSize: 384,
                    liveBufferLatencyChasing: false,
                    liveBufferLatencyMaxLatency: 15,
                    liveBufferLatencyMinRemain: 4
                });
                
                mpegtsPlayer.on(mpegts.Events.ERROR, (errorType, errorDetail, errorInfo) => {
                    console.warn("Player Event:", errorType, errorDetail, errorInfo);
                    
                    if (errorType === mpegts.ErrorTypes.NETWORK_ERROR) {
                        if (errorDetail === mpegts.ErrorDetails.NETWORK_EXCEPTION) {
                            document.getElementById('video-error-text').innerText = `Direct Connection Blocked (CORS) or Server Offline.`;
                        } else {
                            document.getElementById('video-error-text').innerText = `Network connection lost.`;
                        }
                        errorOverlay.classList.remove('hidden');
                        errorOverlay.classList.add('flex');
                    }
                });

                mpegtsPlayer.attachMediaElement(videoElement);
                mpegtsPlayer.load();
                mpegtsPlayer.play().catch(err => console.log("Autoplay prevented:", err));

            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // --- SAFARI / iOS NATIVE FALLBACK (HLS + VLC) ---
                const appleHlsUrl = `${DIRECT_BACKEND_URL}/live/${STREAM_USERNAME}/${STREAM_PASSWORD}/${selectedProgram.mappedIntId}.m3u8`;
                const rawTsUrl = `${DIRECT_BACKEND_URL}/${STREAM_USERNAME}/${STREAM_PASSWORD}/${selectedProgram.mappedIntId}`;
                
                console.log("Loading Native Apple HLS stream:", appleHlsUrl);
                
                videoElement.src = appleHlsUrl;
                videoElement.load();
                
                // If Apple's strict hardware decoder hits the crossed-out play button, catch it and offer VLC!
                videoElement.onerror = function() {
                    console.error("Apple Hardware Codec Blocked Stream.");
                    document.getElementById('video-error-title').innerText = "Apple Codec Block";
                    
                    // The vlc:// URL scheme triggers the VLC iOS app to open the stream
                    document.getElementById('video-error-text').innerHTML = `
                        Safari refuses to decode this stream format.<br><br>
                        <a href="vlc://${rawTsUrl.replace(/^https?:\/\//, '')}" class="mt-6 inline-flex items-center justify-center gap-2 bg-orange-500 hover:bg-orange-400 text-white font-bold py-3 px-6 rounded-xl shadow-lg w-full">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/></svg>
                            Open in VLC
                        </a>
                    `;
                    errorOverlay.classList.remove('hidden');
                    errorOverlay.classList.add('flex');
                };
                
                videoElement.play().catch(err => {
                    console.warn("Safari blocked autoplay. User must tap play manually.", err);
                });

            } else {
                // Absolute worst-case scenario fallback
                document.getElementById('video-error-title').innerText = "Browser Unsupported";
                document.getElementById('video-error-text').innerText = "This device does not support TS or HLS streaming.";
                errorOverlay.classList.remove('hidden');
                errorOverlay.classList.add('flex');
            }
        }

        function closeVideo() {
            const videoModal = document.getElementById('video-modal');
            const videoElement = document.getElementById('tv-player');
            const errorOverlay = document.getElementById('video-error');
            
            videoModal.classList.replace('opacity-100', 'opacity-0'); 
            
            setTimeout(() => {
                videoModal.classList.add('hidden');
                videoModal.classList.remove('flex');
                
                // Clear out the VLC link so it doesn't persist to the next channel
                errorOverlay.classList.add('hidden');
                errorOverlay.classList.remove('flex');
                document.getElementById('video-error-text').innerHTML = 'Could not connect to the stream.';
                
                if (mpegtsPlayer) {
                    mpegtsPlayer.pause();
                    mpegtsPlayer.unload();
                    mpegtsPlayer.detachMediaElement();
                    mpegtsPlayer.destroy();
                    mpegtsPlayer = null;
                }
                
                videoElement.pause();
                videoElement.removeAttribute('src');
                videoElement.load();
            }, 300); 
        }

        async function submitRecording() {
            const btn = document.getElementById('btn-record');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `Scheduling...`;
            btn.disabled = true;

            try {
                let rawProgId = selectedProgram.id;
                if (typeof rawProgId === 'object' && rawProgId !== null) rawProgId = rawProgId.id || rawProgId.pk || rawProgId;

                let progIdInt = parseInt(rawProgId, 10);

                if (isNaN(selectedProgram.mappedIntId) || isNaN(progIdInt)) {
                    throw new Error(`Invalid IDs mapped.`);
                }

                const payload = {
                    channel: selectedProgram.mappedIntId,
                    start_time: selectedProgram.start_time,
                    end_time: selectedProgram.end_time,
                    custom_properties: {
                        program: {
                            id: progIdInt,
                            start_time: selectedProgram.start_time,
                            end_time: selectedProgram.end_time
                        }
                    }
                };

                const response = await fetch(`${DISPATCHARR_URL}/api/channels/recordings/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.innerHTML = `✓ Scheduled`;
                    btn.classList.replace('bg-red-600', 'bg-green-600');
                    setTimeout(closeModal, 1500);
                } else {
                    const errorData = await response.json();
                    const errorField = Object.keys(errorData)[0];
                    let errorMessage = errorData[errorField];
                    if (Array.isArray(errorMessage)) errorMessage = errorMessage[0];
                    else if (typeof errorMessage === 'object') errorMessage = JSON.stringify(errorMessage);
                    throw new Error(`${errorField}: ${errorMessage}`);
                }
            } catch (error) {
                console.error("Recording Error:", error);
                alert("RECORDING FAILED:\n\n" + error.message);
                btn.innerHTML = `Failed`;
                btn.disabled = false;
                btn.classList.replace('bg-red-600', 'bg-orange-600');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-orange-600', 'bg-red-600');
                }, 4000);
            }
        }

        fetchEPG();
    </script>
